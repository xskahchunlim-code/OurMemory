<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的旅行记忆 - 沉浸式时空纪念册</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --gold-main: #d4af37;
            --glass-bg: rgba(15, 20, 35, 0.75);
            --glass-border: rgba(212, 175, 55, 0.25);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020308;
            background-image: radial-gradient(circle at center, #0a1026 0%, #020308 100%);
            font-family: 'Inter', 'Noto Serif SC', sans-serif;
            color: #F7E1D7; overflow: hidden;
        }

        /* 🎬 Loading 视频遮罩层 */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 99999; background: #020308;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #loading-overlay.hidden {
            opacity: 0; pointer-events: none; transform: scale(1.08);
        }
        #loading-video {
            width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; opacity: 0.6;
        }
        .loading-text {
            position: relative; z-index: 2; font-size: 1.2rem; letter-spacing: 4px; color: var(--gold-main);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8); animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        #globe-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .site-header { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; pointer-events: none; }
        .site-header h1 { font-weight: 300; letter-spacing: 4px; font-size: 1.5rem; color: #F7E1D7; margin: 0; }
        .site-header p { font-size: 0.75rem; color: rgba(247, 225, 215, 0.5); letter-spacing: 2px; margin-top: 5px; }

        #mascot-area { position: absolute; bottom: 40px; left: 40px; z-index: 10; }
        .mascot { width: 60px; height: 60px; background: radial-gradient(circle at 30% 30%, #f3e5ab, var(--gold-main) 70%, #8a7322); border-radius: 50%; box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); cursor: pointer; animation: float 3s ease-in-out infinite; display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 0.8rem; color: #050814; transition: transform 0.3s ease; user-select: none; }
        .mascot:hover { transform: scale(1.08); box-shadow: 0 0 35px rgba(212, 175, 55, 0.7); }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }

        .travel-list { position: absolute; bottom: 80px; left: 0; width: 240px; background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 0; opacity: 0; visibility: hidden; transform: translateY(15px); transition: all 0.4s ease; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        #mascot-area:hover .travel-list { opacity: 1; visibility: visible; transform: translateY(0); }
        .travel-item { padding: 12px 20px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; border-left: 2px solid transparent; }
        .travel-item:hover { background: rgba(212, 175, 55, 0.12); color: var(--gold-main); border-left-color: var(--gold-main); padding-left: 24px; }
        .travel-date { font-size: 0.65rem; color: rgba(247, 225, 215, 0.45); margin-bottom: 2px; }

        /* 四部分切换的弹窗样式 */
        #memory-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%) scale(0.95); width: 85%; max-width: 950px; height: 75vh; background: var(--glass-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7); z-index: 100; display: flex; opacity: 0; visibility: hidden; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; overflow: hidden; }
        #memory-modal.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        
        .modal-close { position: absolute; top: 20px; right: 25px; font-size: 1.8rem; cursor: pointer; color: #F7E1D7; opacity: 0.6; transition: opacity 0.3s; z-index: 10; }
        .modal-close:hover { opacity: 1; color: var(--gold-main); }

        .modal-sidebar { width: 260px; border-right: 1px solid rgba(212, 175, 55, 0.15); padding: 40px 20px; display: flex; flex-direction: column; background: rgba(0, 0, 0, 0.2); }
        .modal-location-title { font-size: 1.4rem; font-weight: 300; color: var(--gold-main); margin-bottom: 5px; }
        .modal-location-date { font-size: 0.75rem; color: rgba(247, 225, 215, 0.5); margin-bottom: 30px; }
        
        #modal-date-container { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        .date-switch-btn { background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); color: rgba(247, 225, 215, 0.8); padding: 6px 10px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 4px; }
        .date-switch-btn:hover { background: rgba(212, 175, 55, 0.25); color: var(--gold-main); }
        .date-switch-btn.active { background: var(--gold-main); color: #050814; font-weight: bold; border-color: var(--gold-main); }

        .tab-btn { padding: 14px 18px; margin-bottom: 8px; border-radius: 12px; font-size: 0.85rem; cursor: pointer; color: rgba(247, 225, 215, 0.7); transition: all 0.3s; border: 1px solid transparent; text-align: left; background: transparent; }
        .tab-btn:hover { background: rgba(212, 175, 55, 0.08); color: var(--gold-main); }
        .tab-btn.active { background: rgba(212, 175, 55, 0.15); color: var(--gold-main); border-color: rgba(212, 175, 55, 0.3); font-weight: 600; }

        .modal-body { flex-grow: 1; padding: 40px; overflow-y: auto; position: relative; }
        .tab-content { display: none; animation: fadeIn 0.4s ease forwards; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .media-card { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 12px; overflow: hidden; padding: 10px; text-align: center; }
        .media-card img, .media-card iframe { width: 100%; border-radius: 8px; object-fit: cover; }
        .media-card img { height: 160px; }
        
        .png-showcase { display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; align-items: center; padding: 20px; }
        .png-item { width: 110px; height: 110px; background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(212, 175, 55, 0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; padding: 10px; transition: transform 0.3s; }
        .png-item:hover { transform: scale(1.1); background: rgba(212, 175, 55, 0.1); }
        .png-item img { max-width: 80%; max-height: 80%; object-fit: contain; }
		
        /* 全局照片/视频放大查看器 (Lightbox) */
        #media-lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        #media-lightbox.active { opacity: 1; visibility: visible; }
        .lightbox-close { position: absolute; top: 30px; right: 40px; font-size: 2.5rem; color: #fff; cursor: pointer; opacity: 0.7; transition: opacity 0.3s; }
        .lightbox-close:hover { opacity: 1; color: var(--gold-main); }
        #lightbox-img { max-width: 90%; max-height: 90%; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: none; }
        #lightbox-iframe { width: 90%; max-width: 420px; height: 85vh; border-radius: 16px; background: #000; display: none; }

        /* Part 1 & Part 2 轮播图统一样式 */
        .carousel-container { position: relative; width: 100%; max-width: 550px; margin: 0 auto; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.5); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; background: #000; }
        .carousel-container img { width: 100%; display: block; object-fit: cover; max-height: 420px; }
        
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; font-size: 1.5rem; padding: 12px 16px; cursor: pointer; transition: background 0.3s; z-index: 3; }
        .nav-btn:hover { background: var(--gold-main); color: #000; }
        .nav-btn.left { left: 0; border-radius: 0 8px 8px 0; }
        .nav-btn.right { right: 0; border-radius: 8px 0 0 8px; }
        
        .zoom-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; z-index: 3; transition: all 0.3s; }
        .zoom-btn:hover { background: var(--gold-main); color: #000; transform: scale(1.05); }

        .iframe-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.15); cursor: zoom-in; transition: all 0.3s; z-index: 10; }
        .iframe-overlay:hover { background: rgba(0,0,0,0.4); }
        .iframe-overlay::after { content: '🔍 点击全屏播放'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; opacity: 0; font-weight: bold; transition: opacity 0.3s; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .iframe-overlay:hover::after { opacity: 1; }
    </style>
</head>
<body>

    <!-- 🎬 Loading 播放 MP4 视频与预加载遮罩 -->
    <div id="loading-overlay">
        <!-- 请在此处放入你的 MP4 视频链接或本地路径 -->
        <video id="loading-video" autoplay loop muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-the-night-sky-4008-large.mp4"></video>
        <div class="loading-text">LOADING MEMORIES...</div>
    </div>

    <!-- 🎵 背景音乐 （音频链接可替换为你自己的直链地址） -->
    <audio id="bgm" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=ambient-piano-amp-strings-10711.mp3"></audio>

    <div class="site-header">
        <h1>OUR JOURNEYS</h1>
        <p>专属时空纪念册</p>
    </div>
    
    <div id="globe-container"></div>
    
    <div id="mascot-area">
        <div class="travel-list">
            <!-- 动态生成的列表会注入这里 -->
        </div>
        <div class="mascot">GUIDE</div>
    </div>

    <!-- 升级后的四部分联动弹窗 -->
    <div id="memory-modal">
        <div class="modal-close" onclick="closeModal()">&times;</div>
        
        <div class="modal-sidebar">
            <div class="modal-location-title" id="modal-title">地点名称</div>
            <div class="modal-location-date" id="modal-date">日期</div>
            <div id="modal-date-container"></div>
            
            <button class="tab-btn active" onclick="switchTab('part1')">✨ 1. 合照与回忆</button>
            <button class="tab-btn" onclick="switchTab('part2')">📸 2. 地方风光</button>
            <button class="tab-btn" onclick="switchTab('part3')">🎬 3. Instagram Vlog</button>
            <button class="tab-btn" onclick="switchTab('part4')">🏷️ 4. 纪念小物件</button>
        </div>

        <div class="modal-body">
            <div id="part1" class="tab-content active"><div id="p1-content"></div></div>
            <div id="part2" class="tab-content"><div id="p2-content"></div></div>
            <div id="part3" class="tab-content"><div class="media-grid" id="p3-content"></div></div>
            <div id="part4" class="tab-content"><div class="png-showcase" id="p4-content"></div></div>
        </div>
    </div>
	
    <!-- 全局放大查看器 (Lightbox) -->
    <div id="media-lightbox">
        <div class="lightbox-close" onclick="closeLightbox()">&times;</div>
        <img id="lightbox-img" src="" alt="放大照片">
        <iframe id="lightbox-iframe" src="" frameborder="0" scrolling="no" allowtransparency="true" allowfullscreen></iframe>
    </div>
	
    <script>
        const container = document.getElementById('globe-container');
        const scene = new THREE.Scene();

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 90) * (Math.PI / 180); 
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.copy(latLonToVector3(4.0, 102.0, 320)); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.minDistance = 110; 
        controls.maxDistance = 450;

        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(800 * 3);
        for(let i = 0; i < 2400; i++) starPos[i] = (Math.random() - 0.5) * 800;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xf7e1d7, size: 1, transparent: true, opacity: 0.5 });
        scene.add(new THREE.Points(starGeo, starMat));

        const globeGroup = new THREE.Group();
        scene.add(globeGroup);
        const globeRadius = 100;

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous'); 
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const sphereGeo = new THREE.SphereGeometry(globeRadius, 64, 64);
        const sphereMat = new THREE.MeshStandardMaterial({ map: earthTexture, roughness: 0.6, metalness: 0.1 });
        const innerSphere = new THREE.Mesh(sphereGeo, sphereMat);
        innerSphere.rotation.y = -Math.PI / 2; 
        globeGroup.add(innerSphere);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(200, 100, 150);
        scene.add(dirLight);

        let groupedTravelData = {};

        // 🖼️ 图片预加载辅助函数：在 Loading 阶段提前把所有照片下载完
        function preloadImages(urls) {
            return Promise.all(urls.map(url => {
                return new Promise((resolve) => {
                    if (!url) return resolve();
                    const img = new Image();
                    img.src = url;
                    img.onload = resolve;
                    img.onerror = resolve; // 即使加载失败也继续，避免卡死
                });
            }));
        }

        async function fetchNotionData() {
            try {
                const response = await fetch('/api/get-travels');
                const data = await response.json();
                
                if (!data.results) return;

                groupedTravelData = {};
                const travelListContainer = document.querySelector('.travel-list');
                travelListContainer.innerHTML = '';
                
                let allImageUrlsToPreload = [];

                data.results.forEach((page) => {
                    const props = page.properties;
                    if (!props['name'] || props['name'].title.length === 0) return;

                    const name = props['name'].title[0].plain_text;
                    const dateStr = props['date']?.date?.start || '未知日期';
                    const lat = parseFloat(props['lat']?.number);
                    const lng = parseFloat(props['lng']?.number);

                    // 收集要预加载的照片 URL
                    ['part1_photos', 'part2_photos', 'part4_pngs'].forEach(pName => {
                        if (props[pName]?.files) {
                            props[pName].files.forEach(f => {
                                const u = f.file?.url || f.external?.url;
                                if (u) allImageUrlsToPreload.push(u);
                            });
                        }
                    });

                    if (!isNaN(lat) && !isNaN(lng)) {
                        if (!groupedTravelData[name]) {
                            groupedTravelData[name] = { lat, lng, trips: [] };
                        }
                        
                        let parsedDate = new Date(dateStr);
                        if (isNaN(parsedDate)) parsedDate = new Date('2000-01-01');
                        page._parsedDate = parsedDate;
                        
                        groupedTravelData[name].trips.push(page);
                    }
                });

                // 排序与生成标志
                for (const locationName in groupedTravelData) {
                    const locData = groupedTravelData[locationName];
                    locData.trips.sort((a, b) => a._parsedDate - b._parsedDate);
                    createMarkerOnGlobe(locData.lat, locData.lng);
                    
                    const dateDisplay = locData.trips.length > 1 
                        ? `👣 重游了 ${locData.trips.length} 次` 
                        : (locData.trips[0].properties['date']?.date?.start || '未知日期');

                    const itemHTML = `
                        <div class="travel-item" onclick="flyToLocation(${locData.lat}, ${locData.lng}, '${locationName}')">
                            <span class="travel-date">${dateDisplay}</span>
                            <span>${locationName}</span>
                        </div>
                    `;
                    travelListContainer.innerHTML += itemHTML;
                }

                // 🚀 执行图片预加载
                await preloadImages(allImageUrlsToPreload);

                // ✨ 所有照片预加载完成，隐藏 Loading 遮罩并平滑过渡展示地球
                finishLoading();

            } catch (error) {
                console.error("❌ 后端连接失败：", error);
                finishLoading(); // 出错也允许进入
            }
        }

        // 🎬 完成加载后播放动画与背景音乐
        function finishLoading() {
            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.classList.add('hidden');

            // 自动播放背景音乐（需用户在页面上有任意点击交互或通过允许自动播放规则）
            const bgm = document.getElementById('bgm');
            bgm.play().catch(() => {
                // 若受浏览器政策阻挡，则点击页面任意处后播放
                window.addEventListener('click', () => { bgm.play(); }, { once: true });
            });
        }

        function createMarkerOnGlobe(lat, lon) {
            const pos = latLonToVector3(lat, lon, globeRadius + 0.5);
            const markerGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const markerMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.position.copy(pos);
            globeGroup.add(marker);

            const ringGeo = new THREE.RingGeometry(0.7, 1.4, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xd4af37, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(pos);
            ring.lookAt(new THREE.Vector3(0,0,0)); 
            globeGroup.add(ring);
        }

        fetchNotionData();

        let isAutoRotating = true;

        function flyToLocation(lat, lon, locationName) {
            isAutoRotating = false; 

            const localPos = latLonToVector3(lat, lon, globeRadius + 60); 
            const cameraTargetPos = localPos.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), globeGroup.rotation.y);

            gsap.to(camera.position, {
                x: cameraTargetPos.x,
                y: cameraTargetPos.y,
                z: cameraTargetPos.z,
                duration: 2.2,
                ease: "power2.inOut",
                onUpdate: () => { controls.update(); },
                onComplete: () => { openModal(locationName); }
            });
        }

        // 相册状态管理
        let currentP1Index = 0;
        let p1PhotosArray = [];
        
        let currentP2Index = 0;
        let p2PhotosArray = [];
        
        let currentOpenLocation = ''; 

        const modal = document.getElementById('memory-modal');
        function openModal(locationName) {
            currentOpenLocation = locationName;
            const locData = groupedTravelData[locationName];
            if (!locData || locData.trips.length === 0) return;

            document.getElementById('modal-title').innerText = locationName;

            const dateContainer = document.getElementById('modal-date-container');
            const singleDateText = document.getElementById('modal-date');

            if (locData.trips.length > 1) {
                let btnsHTML = '';
                locData.trips.forEach((trip, idx) => {
                    const d = trip.properties['date']?.date?.start || '未知日期';
                    const activeClass = idx === 0 ? 'active' : '';
                    btnsHTML += `<button class="date-switch-btn ${activeClass}" onclick="renderTripContent(${idx})">🗓️ ${d}</button>`;
                });
                dateContainer.innerHTML = btnsHTML;
                dateContainer.style.display = 'flex';
                singleDateText.style.display = 'none';
            } else {
                dateContainer.style.display = 'none';
                singleDateText.innerText = locData.trips[0].properties['date']?.date?.start || '未知日期';
                singleDateText.style.display = 'block';
            }

            renderTripContent(0);
            switchTab('part1');
            modal.classList.add('active');
        }

        function renderTripContent(tripIndex) {
            const locData = groupedTravelData[currentOpenLocation];
            const row = locData.trips[tripIndex];
            const props = row.properties;
            
            if (locData.trips.length > 1) {
                const btns = document.querySelectorAll('.date-switch-btn');
                btns.forEach((btn, idx) => {
                    btn.classList.toggle('active', idx === tripIndex);
                });
            }

            const memory = props['memory']?.rich_text[0]?.plain_text || '留下的美好回忆...';
            
            function getUploadedImages(propName) {
                const prop = props[propName];
                if (!prop || !prop.files) return [];
                return prop.files.map(f => f.file?.url || f.external?.url).filter(Boolean);
            }

            p1PhotosArray = getUploadedImages('part1_photos');
            p2PhotosArray = getUploadedImages('part2_photos');
            const part4Pngs   = getUploadedImages('part4_pngs');
            const reelsText = props['part3_reels']?.rich_text[0]?.plain_text || '';
            const part3Reels = reelsText ? reelsText.split(/[,\n\s]+/).filter(url => url.includes('http')) : [];

            if (p1PhotosArray.length === 0) p1PhotosArray = ['https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600'];
            currentP1Index = 0; 
            currentP2Index = 0;

            // ✨ Part 1: 文案在上，轮播在下（已无无故闪烁问题）
            let p1HTML = `
                <div class="part1-text" style="text-align: center; font-size: 1.1rem; line-height: 1.7; margin-bottom: 20px; color: #F7E1D7; font-weight: 300;">
                    ${memory}
                </div>
                <div class="carousel-container">
                    <img id="p1-main-img" src="${p1PhotosArray[0]}" alt="合照">
                    <button class="zoom-btn" onclick="openLightbox('image', p1PhotosArray[currentP1Index])">🔍 放大</button>
                    ${p1PhotosArray.length > 1 ? `
                        <button class="nav-btn left" onclick="changeP1Photo(-1)">&#10094;</button>
                        <button class="nav-btn right" onclick="changeP1Photo(1)">&#10095;</button>
                    ` : ''}
                </div>
            `;
            document.getElementById('p1-content').innerHTML = p1HTML;

            // ✨ Part 2: 地方风光 - 新增 NEXT / BACK 轮播功能
            let p2HTML = '';
            if (p2PhotosArray.length > 0) {
                p2HTML = `
                    <div class="carousel-container">
                        <img id="p2-main-img" src="${p2PhotosArray[0]}" alt="风光照片">
                        <button class="zoom-btn" onclick="openLightbox('image', p2PhotosArray[currentP2Index])">🔍 放大</button>
                        ${p2PhotosArray.length > 1 ? `
                            <button class="nav-btn left" onclick="changeP2Photo(-1)">&#10094;</button>
                            <button class="nav-btn right" onclick="changeP2Photo(1)">&#10095;</button>
                        ` : ''}
                    </div>
                `;
            } else {
                p2HTML = '<div style="color:rgba(247, 225, 215, 0.4); text-align: center; padding: 40px;">暂无风光照片</div>';
            }
            document.getElementById('p2-content').innerHTML = p2HTML;

            // Part 3: Instagram Vlog 
            let p3HTML = '';
            part3Reels.forEach(url => {
                let embedUrl = url.trim();
                if(embedUrl.includes('instagram.com') && !embedUrl.includes('embed')) embedUrl = embedUrl.replace(/\/?$/, '/embed');
                p3HTML += `
                <div class="media-card" style="position: relative;">
                    <iframe src="${embedUrl}" width="100%" height="220" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
                    <div class="iframe-overlay" onclick="openLightbox('video', '${embedUrl}')"></div>
                </div>`;
            });
            document.getElementById('p3-content').innerHTML = p3HTML || '<div style="color:rgba(247, 225, 215, 0.4); text-align: center;">暂无 Vlog 视频</div>';

            // Part 4: PNG 小物件
            let p4HTML = '';
            part4Pngs.forEach(url => {
                p4HTML += `<div class="png-item"><img src="${url}" alt="纪念物件"></div>`;
            });
            document.getElementById('p4-content').innerHTML = p4HTML || '<div style="color:rgba(247, 225, 215, 0.4); text-align: center;">暂无专属纪念物件</div>';
        }

        // --- Part 1 无闪烁轮播 ---
        function changeP1Photo(direction) {
            currentP1Index = (currentP1Index + direction + p1PhotosArray.length) % p1PhotosArray.length;
            const imgEl = document.getElementById('p1-main-img');
            imgEl.src = p1PhotosArray[currentP1Index];
        }

        // --- Part 2 轮播 (NEXT / BACK) ---
        function changeP2Photo(direction) {
            currentP2Index = (currentP2Index + direction + p2PhotosArray.length) % p2PhotosArray.length;
            const imgEl = document.getElementById('p2-main-img');
            imgEl.src = p2PhotosArray[currentP2Index];
        }

        // --- 全局放大查看器 (Lightbox) ---
        const lightbox = document.getElementById('media-lightbox');
        const lbImg = document.getElementById('lightbox-img');
        const lbIframe = document.getElementById('lightbox-iframe');

        function openLightbox(type, url) {
            if (type === 'image') {
                lbImg.src = url;
                lbImg.style.display = 'block';
                lbIframe.style.display = 'none';
            } else if (type === 'video') {
                lbIframe.src = url;
                lbIframe.style.display = 'block';
                lbImg.style.display = 'none';
            }
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            setTimeout(() => {
                lbImg.src = '';
                lbIframe.src = '';
            }, 300);
        }

        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) closeLightbox();
        });
		
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (event && event.currentTarget) event.currentTarget.classList.add('active');
        }

        function closeModal() { 
            modal.classList.remove('active'); 
            isAutoRotating = true; 
        }

        function animate() { 
            requestAnimationFrame(animate); 
            if (isAutoRotating) globeGroup.rotation.y += 0.0010; 
            controls.update(); 
            renderer.render(scene, camera); 
        }
        animate();

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        });
    </script>
</body>
</html>
